[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-janitor"
dynamic = ["version"]
description = "Audit local Git repositories and clean up merged or stale branches."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9",
    "rich>=13",
]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/ledermandaniel4-svg/Git-Janitor"
Repository = "https://github.com/ledermandaniel4-svg/Git-Janitor"
Issues = "https://github.com/ledermandaniel4-svg/Git-Janitor/issues"

# Git runs any `git-<name>` executable on PATH as `git <name>`,
# so this one entry point also provides `git janitor`.
[project.scripts]
git-janitor = "git_janitor.cli:app"

[tool.hatch.version]
path = "src/git_janitor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/git_janitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
